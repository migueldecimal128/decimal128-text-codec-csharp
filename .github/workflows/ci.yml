name: ci

# The codec is one file with no runtime dependencies and one target, the CLR, so
# CI exists to run it somewhere the developer does not: the working host is
# macOS/aarch64, and Linux/x86-64 is where every other reader will be.
#
# Both configurations run. Debug is the one that arms VERIFY_ENABLED, so it is
# the run that exercises the internal-state assertions over the whole corpus;
# Release is what a consumer actually compiles against, and running it proves
# the codec does not depend on those assertions for its answers.
#
# The conformance vectors come from decimal128-resources, mounted as a submodule
# at <repo>/resources, so the checkout needs `submodules: recursive` -- without
# it every corpus test fails with the `git submodule update` hint rather than
# quietly passing on no rows. The 84,783-row canonical table comes with it.

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test Decimal128.TextCodec.slnx -c ${{ matrix.configuration }} --nologo
